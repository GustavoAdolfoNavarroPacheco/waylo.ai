# Categories for the notes GitHub generates when a release is created ("Generate release notes").
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: Novedades
      labels: [enhancement]
    - title: Correcciones
      labels: [bug]
    - title: Documentación
      labels: [documentation]
    - title: Dependencias
      labels: [dependencies]
    - title: Otros cambios
      labels: ["*"]
