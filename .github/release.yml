# Categories for the notes GitHub generates when a release is created ("Generate release notes").
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: What's new
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
