name: Suggest an improvement
description: An idea to help Waylo guide better or be easier to use.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Tell us who it affects and when.
      placeholder: An older person finds it hard to type their symptoms...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How do you picture it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What alternatives did you consider?
  - type: checkboxes
    id: limits
    attributes:
      label: Waylo's limits
      description: Waylo guides; it does not diagnose or prescribe.
      options:
        - label: The idea does not make Waylo diagnose, prescribe or give doses or home remedies.
          required: true
        - label: It does not require storing conversation text or health data without consent.
          required: false
