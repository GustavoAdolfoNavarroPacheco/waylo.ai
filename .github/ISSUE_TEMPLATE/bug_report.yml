name: Report a bug
description: Something does not work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve Waylo.
        **If this is a security vulnerability, do not use this form:** follow the [security policy](https://github.com/GustavoAdolfoNavarroPacheco/waylo.ai/security/policy).
  - type: textarea
    id: what-happens
    attributes:
      label: What is happening?
      description: Describe the bug in your own words.
      placeholder: When I send a message with an attachment, the chat keeps loading.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. Go to '...'
        2. Click '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Home page
        - Chat and guidance
        - Voice (Waylo Live)
        - Attachments
        - Account, sign-up or sign-in
        - Settings (EPS, memory, preferences)
        - IPS integration
        - Installation or deployment
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: Android 14, Chrome 130 / Windows 11, Edge 130
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options: [Spanish, English, Portuguese]
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Drag images here or paste the console error.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I confirm I am not including real patient data, identity documents, keys or tokens.
          required: true
