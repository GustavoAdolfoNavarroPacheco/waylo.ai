name: Commit messages

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The whole history, so the range of the pull request can be listed.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-commit-message.mjs --range "$BASE_SHA..$HEAD_SHA"
